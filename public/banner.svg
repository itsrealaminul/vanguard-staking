<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1023"/>
      <stop offset="50%" stop-color="#0E1630"/>
      <stop offset="100%" stop-color="#0B1023"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C48D0A"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C48D0A"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,213,79,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#FFD54F" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Background glow circles -->
  <circle cx="300" cy="200" r="200" fill="url(#circleGlow)" opacity="0.5"/>
  <circle cx="900" cy="400" r="250" fill="url(#circleGlow)" opacity="0.3"/>
  <circle cx="640" cy="320" r="150" fill="url(#circleGlow)" opacity="0.4"/>

  <!-- Floating particles -->
  <circle cx="150" cy="100" r="2" fill="#FFD54F" opacity="0.6"/>
  <circle cx="350" cy="180" r="1.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="550" cy="90" r="2.5" fill="#FFD54F" opacity="0.5"/>
  <circle cx="750" cy="150" r="1.8" fill="#FFD54F" opacity="0.3"/>
  <circle cx="950" cy="100" r="2" fill="#FFD54F" opacity="0.6"/>
  <circle cx="1100" cy="200" r="1.5" fill="#FFD54F" opacity="0.4"/>
  <circle cx="200" cy="500" r="2" fill="#FFD54F" opacity="0.5"/>
  <circle cx="1050" cy="480" r="2.5" fill="#FFD54F" opacity="0.3"/>
  <circle cx="400" cy="550" r="1.8" fill="#FFD54F" opacity="0.4"/>
  <circle cx="850" cy="520" r="2" fill="#FFD54F" opacity="0.5"/>

  <!-- Corner brackets -->
  <g stroke="#FFD54F" stroke-width="2" opacity="0.3">
    <path d="M30,30 L30,60 M30,30 L60,30"/>
    <path d="M1250,30 L1250,60 M1250,30 L1220,30"/>
    <path d="M30,610 L30,580 M30,610 L60,610"/>
    <path d="M1250,610 L1250,580 M1250,610 L1220,610"/>
  </g>

  <!-- Main Logo (Gold Triangle) -->
  <g transform="translate(640, 220)" filter="url(#glowBig)">
    <polygon points="0,-90 78,52 -78,52" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="0,-70 62,42 -62,42" fill="url(#gold)" opacity="0.9"/>
    <circle cx="0" cy="28" r="14" fill="#FFECB3" opacity="0.8"/>
    <circle cx="0" cy="24" r="7" fill="#FFD54F" opacity="0.6"/>
  </g>

  <!-- Title -->
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="8" fill="url(#gold)" filter="url(#glow)">VANGUARD STAKING</text>

  <!-- Subtitle -->
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="#7A8CA5">STAKE • EARN • GROW</text>

  <!-- Divider line -->
  <line x1="440" y1="415" x2="840" y2="415" stroke="url(#gold2)" stroke-width="1" opacity="0.4"/>

  <!-- Feature badges -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600">
    <!-- Badge 1 -->
    <rect x="180" y="450" width="180" height="40" rx="8" fill="rgba(255,213,79,0.08)" stroke="rgba(255,213,79,0.2)" stroke-width="1"/>
    <text x="270" y="475" text-anchor="middle" fill="#FFD54F">💰 Stake USDT</text>

    <!-- Badge 2 -->
    <rect x="380" y="450" width="180" height="40" rx="8" fill="rgba(255,213,79,0.08)" stroke="rgba(255,213,79,0.2)" stroke-width="1"/>
    <text x="470" y="475" text-anchor="middle" fill="#FFD54F">🔍 Token Scanner</text>

    <!-- Badge 3 -->
    <rect x="580" y="450" width="180" height="40" rx="8" fill="rgba(255,213,79,0.08)" stroke="rgba(255,213,79,0.2)" stroke-width="1"/>
    <text x="670" y="475" text-anchor="middle" fill="#FFD54F">⛽ Gas Tracker</text>

    <!-- Badge 4 -->
    <rect x="780" y="450" width="180" height="40" rx="8" fill="rgba(255,213,79,0.08)" stroke="rgba(255,213,79,0.2)" stroke-width="1"/>
    <text x="870" y="475" text-anchor="middle" fill="#FFD54F">🎓 Academy</text>

    <!-- Badge 5 -->
    <rect x="980" y="450" width="140" height="40" rx="8" fill="rgba(0,184,148,0.1)" stroke="rgba(0,184,148,0.25)" stroke-width="1"/>
    <text x="1050" y="475" text-anchor="middle" fill="#00b894">40% Referral</text>
  </g>

  <!-- Trust indicators -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#7A8CA5">
    <text x="320" y="530" text-anchor="middle">🔒 Secure Protocol</text>
    <text x="520" y="530" text-anchor="middle">⚡ Instant Deposits</text>
    <text x="720" y="530" text-anchor="middle">🌍 5,000+ Users</text>
    <text x="920" y="530" text-anchor="middle">🛡️ Daily Rewards</text>
  </g>

  <!-- Bottom tagline -->
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#FFD54F" opacity="0.7" letter-spacing="2">Your All-in-One Crypto Platform</text>

  <!-- Version badge -->
  <rect x="560" y="598" width="160" height="24" rx="12" fill="rgba(255,213,79,0.1)" stroke="rgba(255,213,79,0.15)" stroke-width="1"/>
  <text x="640" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#7A8CA5">v2.0 • TRC-20</text>
</svg>
